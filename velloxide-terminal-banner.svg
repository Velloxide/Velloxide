<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Velloxide terminal banner</title>
<desc>Terminal window styled banner with matrix rain background, red accents, and typed introduction lines</desc>

<rect x="0" y="0" width="900" height="260" rx="10" fill="#0a0c10"/>

<clipPath id="clip-body">
  <rect x="1" y="35" width="898" height="224" rx="0"/>
</clipPath>

<g clip-path="url(#clip-body)" opacity="0.16">
  <g font-family="monospace" font-size="14" fill="#ff1e1e">
    <text x="40" y="20"><tspan>01</tspan><animate attributeName="y" from="20" to="280" dur="4.2s" repeatCount="indefinite"/></text>
    <text x="90" y="60"><tspan>1</tspan><animate attributeName="y" from="60" to="320" dur="3.4s" repeatCount="indefinite"/></text>
    <text x="140" y="10"><tspan>10</tspan><animate attributeName="y" from="10" to="300" dur="5.1s" repeatCount="indefinite"/></text>
    <text x="200" y="90"><tspan>0</tspan><animate attributeName="y" from="90" to="350" dur="3.9s" repeatCount="indefinite"/></text>
    <text x="260" y="30"><tspan>11</tspan><animate attributeName="y" from="30" to="290" dur="4.6s" repeatCount="indefinite"/></text>
    <text x="700" y="15"><tspan>01</tspan><animate attributeName="y" from="15" to="270" dur="4s" repeatCount="indefinite"/></text>
    <text x="760" y="70"><tspan>1</tspan><animate attributeName="y" from="70" to="330" dur="3.6s" repeatCount="indefinite"/></text>
    <text x="820" y="20"><tspan>10</tspan><animate attributeName="y" from="20" to="290" dur="4.9s" repeatCount="indefinite"/></text>
    <text x="850" y="100"><tspan>0</tspan><animate attributeName="y" from="100" to="360" dur="3.3s" repeatCount="indefinite"/></text>
    <text x="600" y="50"><tspan>11</tspan><animate attributeName="y" from="50" to="310" dur="4.4s" repeatCount="indefinite"/></text>
  </g>
</g>

<rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="none" stroke="#ff1e1e" stroke-width="1" opacity="0.5"/>

<rect x="0" y="0" width="900" height="34" rx="10" fill="#12151b"/>
<rect x="0" y="24" width="900" height="10" fill="#12151b"/>
<circle cx="24" cy="17" r="6" fill="#ff5f56"/>
<circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="68" cy="17" r="6" fill="#27c93f"/>
<text x="450" y="21" font-family="monospace" font-size="12" fill="#6b7280" text-anchor="middle">velloxide@1337:~</text>

<g font-family="monospace" font-size="17" fill="#ff1e1e">
  <text x="40" y="75">root@velloxide:~$ whoami</text>
</g>
<g font-family="monospace" font-size="17" fill="#e6e6e6">
  <text x="40" y="105">&gt; Cybersecurity Engineer | Binary Exploitation (Pwn)</text>
</g>

<g font-family="monospace" font-size="17" fill="#ff1e1e">
  <text x="40" y="140">root@velloxide:~$ cat mission.txt</text>
</g>
<g font-family="monospace" font-size="17" fill="#e6e6e6">
  <text x="40" y="170">&gt; 1337 Piscine &amp; CompTIA Net+ Prep // Low-level C &amp; System Design</text>
</g>

<g font-family="monospace" font-size="17" fill="#ff1e1e">
  <text x="40" y="205">root@velloxide:~$ echo $QUOTE</text>
</g>
<g font-family="monospace" font-size="17" fill="#9ca3af" font-style="italic">
  <text x="40" y="235">&gt; "Reality is a well-coded genjutsu."</text>
</g>

<rect x="465" y="220" width="10" height="18" fill="#ff1e1e">
  <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
</rect>
</svg>
